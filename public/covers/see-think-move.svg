<!--
  Original drawing for the "See, think, move" project.
  It has its own colors on purpose. An image in public/ does not
  follow the site's light and dark switch the way a generated cover does.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <rect width="960" height="540" fill="#f3eee4"/>
  <pattern id="plate-dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1.15" fill="#e3d7c6"/>
  </pattern>
  <rect width="960" height="540" fill="url(#plate-dots)"/>
  <circle cx="250" cy="250" r="150" fill="#e7f3ef"/>
  <circle cx="700" cy="160" r="90" fill="#f6e6d8"/>

  <rect x="70" y="86" width="560" height="360" rx="28" fill="#fffdf8" stroke="#e4d9c8" stroke-width="2"/>
  <rect x="430" y="140" width="160" height="230" rx="18" fill="#f7fbf9" stroke="#0f5c52" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="510" y="178" text-anchor="middle" fill="#0f5c52" font-family="ui-monospace, monospace" font-size="16">tray</text>

  <path d="M150 300 C 210 210, 280 250, 340 210" stroke="#1c1915" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
  <path d="M150 300 C 200 250, 260 230, 330 200" stroke="#0f5c52" stroke-width="2" stroke-linecap="round"/>
  <path d="M150 300 C 190 270, 250 240, 318 206" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round"/>

  <rect x="292" y="176" width="52" height="52" rx="8" fill="#c4492c"/>
  <text x="318" y="208" text-anchor="middle" fill="#fffdf8" font-family="ui-monospace, monospace" font-size="20">R</text>
  <rect x="188" y="250" width="52" height="52" rx="8" fill="#2c5fb5"/>
  <text x="214" y="282" text-anchor="middle" fill="#fffdf8" font-family="ui-monospace, monospace" font-size="20">B</text>
  <rect x="120" y="330" width="52" height="52" rx="8" fill="#1c7d68"/>
  <text x="146" y="362" text-anchor="middle" fill="#fffdf8" font-family="ui-monospace, monospace" font-size="20">G</text>

  <g stroke="#1c1915" stroke-width="4" stroke-linecap="round">
    <path d="M132 268 L146 292"/>
    <path d="M168 268 L154 292"/>
  </g>
  <circle cx="150" cy="258" r="9" fill="#fffdf8" stroke="#1c1915" stroke-width="3"/>

  <g>
    <rect x="680" y="150" width="220" height="250" rx="20" fill="#fffdf8" stroke="#e4d9c8"/>
    <text x="712" y="196" fill="#9a3412" font-family="ui-monospace, monospace" font-size="15">SEE</text>
    <text x="712" y="228" fill="#1c1915" font-family="Georgia, serif" font-size="20">red, left</text>
    <text x="712" y="276" fill="#9a3412" font-family="ui-monospace, monospace" font-size="15">THINK</text>
    <text x="712" y="308" fill="#1c1915" font-family="Georgia, serif" font-size="20">carry it over</text>
    <text x="712" y="356" fill="#9a3412" font-family="ui-monospace, monospace" font-size="15">MOVE</text>
    <text x="712" y="388" fill="#1c1915" font-family="Georgia, serif" font-size="20">a short path</text>
  </g>
</svg>
