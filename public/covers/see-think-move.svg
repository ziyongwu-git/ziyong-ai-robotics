<!--
  Original drawing for See, think, move.
  A tabletop, three labeled blocks, and a path that starts noisy and is pulled onto a curve.
  ASCII only. Colors stay put in both themes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <rect width="960" height="540" fill="#f6f3ec"/>
  <pattern id="plate-dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1.15" fill="#e4dace"/>
  </pattern>
  <rect width="960" height="540" fill="url(#plate-dots)"/>

  <rect x="48" y="48" width="600" height="444" rx="28" fill="#fffdf8" stroke="#e4dace" stroke-width="2"/>
  <rect x="430" y="90" width="180" height="250" rx="18" fill="#d9efe9" stroke="#0a534a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="520" y="124" text-anchor="middle" fill="#0a534a" font-family="ui-monospace, monospace" font-size="16">tray</text>

  <path d="M150 340 C 220 250, 280 280, 360 230" stroke="#5c564c" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round" fill="none"/>
  <path d="M150 340 C 210 280, 270 250, 348 220" stroke="#0a534a" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M150 340 C 200 300, 260 270, 336 226" stroke="#7c2d12" stroke-width="4" stroke-linecap="round" fill="none"/>

  <rect x="310" y="196" width="52" height="52" rx="8" fill="#c4492c"/>
  <text x="336" y="228" text-anchor="middle" fill="#fffdf8" font-family="ui-monospace, monospace" font-size="20">R</text>
  <rect x="180" y="250" width="52" height="52" rx="8" fill="#2c5fb5"/>
  <text x="206" y="282" text-anchor="middle" fill="#fffdf8" font-family="ui-monospace, monospace" font-size="20">B</text>
  <rect x="110" y="360" width="52" height="52" rx="8" fill="#1c7d68"/>
  <text x="136" y="392" text-anchor="middle" fill="#fffdf8" font-family="ui-monospace, monospace" font-size="20">G</text>

  <g stroke="#1c1915" stroke-width="4" stroke-linecap="round">
    <path d="M128 300 L 142 324"/>
    <path d="M168 300 L 154 324"/>
  </g>
  <circle cx="148" cy="292" r="8" fill="#fffdf8" stroke="#1c1915" stroke-width="3"/>

  <g font-family="ui-monospace, monospace">
    <rect x="680" y="80" width="232" height="360" rx="22" fill="#fffdf8" stroke="#e4dace"/>
    <text x="708" y="130" fill="#7c2d12" font-size="15">SEE</text>
    <text x="708" y="162" fill="#1c1915" font-family="Georgia, serif" font-size="22">red, new spot</text>
    <text x="708" y="220" fill="#7c2d12" font-size="15">THINK</text>
    <text x="708" y="252" fill="#1c1915" font-family="Georgia, serif" font-size="22">carry it over</text>
    <text x="708" y="310" fill="#7c2d12" font-size="15">MOVE</text>
    <text x="708" y="342" fill="#1c1915" font-family="Georgia, serif" font-size="22">noisy, then pulled</text>
    <text x="708" y="400" fill="#5c564c" font-size="14">dashed start</text>
  </g>
</svg>
