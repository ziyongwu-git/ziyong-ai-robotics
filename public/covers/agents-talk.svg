<!--
  Original drawing for the note on how agents talk.
  Plan reader, clinic finder, and the directory tool. A2A between agents, MCP to the tool.
  ASCII only. Colors stay put in both themes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none">
  <rect width="960" height="540" fill="#f6f3ec"/>
  <pattern id="talk-dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1.15" fill="#e4dace"/>
  </pattern>
  <rect width="960" height="540" fill="url(#talk-dots)"/>
  <circle cx="160" cy="100" r="70" fill="#f6e4d4"/>
  <circle cx="800" cy="450" r="100" fill="#d9efe9"/>

  <rect x="60" y="140" width="250" height="250" rx="28" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="185" y="196" text-anchor="middle" fill="#7c2d12" font-family="ui-monospace, monospace" font-size="15">CLIENT</text>
  <text x="185" y="244" text-anchor="middle" fill="#1c1915" font-family="Georgia, serif" font-size="28">Plan reader</text>
  <text x="185" y="290" text-anchor="middle" fill="#5c564c" font-family="Georgia, serif" font-size="18">another stack</text>
  <text x="185" y="340" text-anchor="middle" fill="#5c564c" font-family="Georgia, serif" font-size="16">sees a card</text>

  <path d="M320 230 H 420" stroke="#1c1915" stroke-width="2.5"/>
  <path d="M408 222 L 426 230 L 408 238" stroke="#1c1915" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M420 300 H 320" stroke="#0a534a" stroke-width="2.5"/>
  <path d="M332 292 L 314 300 L 332 308" stroke="#0a534a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="338" y="198" width="64" height="28" rx="8" fill="#7c2d12"/>
  <text x="370" y="217" text-anchor="middle" fill="#fffdf8" font-family="ui-monospace, monospace" font-size="13">A2A</text>

  <rect x="440" y="110" width="280" height="230" rx="28" fill="#f6e4d4" stroke="#7c2d12" stroke-width="2"/>
  <text x="580" y="166" text-anchor="middle" fill="#7c2d12" font-family="ui-monospace, monospace" font-size="15">AGENT</text>
  <text x="580" y="214" text-anchor="middle" fill="#1c1915" font-family="Georgia, serif" font-size="28">Clinic finder</text>
  <text x="580" y="258" text-anchor="middle" fill="#5c564c" font-family="Georgia, serif" font-size="18">prompt stays inside</text>
  <text x="580" y="296" text-anchor="middle" fill="#0a534a" font-family="ui-monospace, monospace" font-size="15">MCP client</text>

  <path d="M580 340 V 390" stroke="#0a534a" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="470" y="390" width="280" height="100" rx="18" fill="#fffdf8" stroke="#0a534a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="610" y="430" text-anchor="middle" fill="#0a534a" font-family="ui-monospace, monospace" font-size="15">TOOL</text>
  <text x="610" y="460" text-anchor="middle" fill="#1c1915" font-family="Georgia, serif" font-size="22">find_clinics</text>
</svg>
